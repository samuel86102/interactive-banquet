<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>師大重聚 點出好運</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0D1B2A;
            --primary-card-bg: #1B263B;
            --secondary-card-bg: #415A77;
            --text-color: #E0E1DD;
            --accent-color: #FFC300;
            --action-color: #e74c3c;
            --disabled-color: #95a5a6;
        }
        body {
            font-family: 'Noto Sans TC', 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            background-image: url('/static/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            text-align: center;
        }
        .container {
            max-width: 90%;
            width: 400px;
            padding: 20px;
            background: var(--primary-card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        #selection-view, #game-view { display: none; }
        #selection-view.active, #game-view.active { display: block; }
        h2 {
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 25px;
        }
        select, button {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            margin-top: 15px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        select {
            background: var(--secondary-card-bg);
            color: var(--text-color);
            border: 2px solid var(--secondary-card-bg);
        }
        button {
            background: var(--action-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:disabled {
            background: var(--disabled-color);
            cursor: not-allowed;
        }
        #number-display {
            font-size: 6em;
            font-weight: 700;
            color: var(--accent-color);
            margin: 30px 0;
            min-height: 100px;
            text-shadow: 0 0 15px rgba(255, 195, 0, 0.5);
        }
        #message {
            margin-top: 20px;
            color: #e67e22;
            height: 25px;
            font-weight: 600;
        }
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #game-title.winner-title {
            color: var(--accent-color);
            animation: winner-pulse 1.5s infinite;
        }
        @keyframes winner-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="fireworks-container"></div>

    <div class="container">
        <div id="selection-view" class="active">
            <h2>師大重聚 點出好運</h2>
            <select id="table-selector">
                <option value="">-- 請選擇您的桌號 --</option>
            </select>
            <div id="message"></div>
        </div>

        <div id="game-view">
            <h2 id="game-title"></h2>
            <div id="number-display">--</div>
            <button id="stop-button">就是這個！</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.7/dist/index.umd.js"></script>
    <script>
        const socket = io();

        const selectionView = document.getElementById('selection-view');
        const gameView = document.getElementById('game-view');
        const tableSelector = document.getElementById('table-selector');
        const messageDiv = document.getElementById('message');
        
        const gameTitle = document.getElementById('game-title');
        const numberDisplay = document.getElementById('number-display');
        const stopButton = document.getElementById('stop-button');
        
        const fireworksContainer = document.getElementById('fireworks-container');
        const fireworks = new Fireworks.default(fireworksContainer);

        let myTableId = null;
        let numberSpinner = null;
        let currentNumberRange = [1, 100];
        let tableLayout = []; // <--- FIX: Store layout info

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        socket.on('update_state', (state) => {
            console.log('State updated:', state);
            currentNumberRange = state.number_range;
            tableLayout = state.layout; // <--- FIX: Save the layout from state

            const isFirstLoad = tableSelector.options.length <= 1;

            // Populate or update dropdown options based on state
            state.layout.forEach(tableDef => {
                let option = isFirstLoad ? document.createElement('option') : Array.from(tableSelector.options).find(o => o.value === tableDef.id);
                if (!option) return;

                option.value = tableDef.id;
                option.textContent = `${tableDef.id} ${tableDef.name}`;
                option.disabled = false;

                const tableState = state.tables[tableDef.id];
                if (tableState) {
                    if (tableState.locked) {
                        option.disabled = true;
                        option.textContent += ' (已鎖定)';
                    } else if (tableState.sid && myTableId !== tableDef.id) {
                        option.disabled = true;
                        option.textContent += ' (操作中)';
                    }
                }
                if (isFirstLoad) {
                    tableSelector.appendChild(option);
                }
            });

            // Update game view if a table is selected
            if (myTableId) {
                const tableState = state.tables[myTableId];
                if (tableState && tableState.locked) {
                    if (numberSpinner) clearInterval(numberSpinner);
                    numberDisplay.textContent = tableState.number;
                    stopButton.textContent = '已鎖定';
                    stopButton.disabled = true;
                }
            }
        });

        tableSelector.addEventListener('change', () => {
            const selectedId = tableSelector.value;
            if (selectedId) {
                messageDiv.textContent = '';
                socket.emit('select_table', { table_id: selectedId });
            }
        });

        socket.on('table_in_use', (data) => {
            messageDiv.textContent = `桌次 ${data.table_id} 正在被他人操作中！`;
            tableSelector.value = '';
        });

        socket.on('table_selected_ok', (data) => {
            myTableId = data.table_id;
            // <--- FIX: Use the stored tableLayout to find table info
            const tableDef = tableLayout.find(t => t.id === myTableId);

            selectionView.classList.remove('active');
            gameView.classList.add('active');
            
            if (tableDef) {
                gameTitle.textContent = `${tableDef.id} ${tableDef.name}`;
            } else {
                gameTitle.textContent = myTableId; // Fallback in case not found
            }
            
            if (numberSpinner) clearInterval(numberSpinner);
            numberSpinner = setInterval(() => {
                numberDisplay.textContent = getRandomInt(currentNumberRange[0], currentNumberRange[1]);
            }, 100);
        });

        stopButton.addEventListener('click', () => {
            if (myTableId) {
                stopButton.disabled = true;
                stopButton.textContent = '選定中...';
                socket.emit('stop_number', { table_id: myTableId });
            }
        });

        socket.on('game_over', (data) => {
            const winnerId = data.winner.table_id;
            if (myTableId && myTableId === winnerId) {
                console.log("We are the winner!");
                gameTitle.classList.add('winner-title');
                gameTitle.innerHTML = "🎉 我們是冠軍！ 🎉";
                fireworks.start();
            }
        });

        socket.on('game_restarted', () => {
            console.log('Game has been restarted. Reloading page.');
            window.location.reload();
        });

        socket.on('force_reset_client', () => {
            alert('您的桌次已被管理員重置，將返回選擇畫面。');
            window.location.reload();
        });

    </script>
</body>
</html>
