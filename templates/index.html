<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>返校幸運數字 Let's Go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-color: #0D1B2A;
            --primary-card-bg: #1B263B;
            --secondary-card-bg: #415A77;
            --text-color: #E0E1DD;
            --accent-color: #FFC300;
            --locked-color: #50c878;
            --reset-color: #e74c3c;
            --reset-hover: #c0392b;
            --table-size: 120px;

            --group-abc-border: #C77DFF;
            --group-de-border: #7D8AFF;
            --group-fgi-border: #FF9B54;
            --group-hj-border: #D2691E;
            --group-main-border: #e74c3c;
        }
        body {
            font-family: 'Noto Sans TC', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: url('/static/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }
        h1 {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 2.8em;
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 195, 0, 0.5);
        }
        #tables-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        .table-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .table-card {
            border: 3px solid var(--secondary-card-bg);
            border-radius: 50%;
            width: var(--table-size);
            height: var(--table-size);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-card-bg);
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .table-card.locked { cursor: pointer; }
        .table-card.locked:hover { transform: scale(1.05); border-color: var(--reset-color); }
        .table-card.winner { z-index: 10; animation: winner-glow 1.5s infinite alternate; }
        @keyframes winner-glow {
            from { transform: scale(1.1); box-shadow: 0 0 15px var(--accent-color); border-color: var(--accent-color); }
            to { transform: scale(1.15); box-shadow: 0 0 40px var(--accent-color); border-color: var(--accent-color); }
        }
        .table-id { font-size: calc(var(--table-size) * 0.22); font-weight: 700; color: var(--text-color); }
        .table-name { font-size: calc(var(--table-size) * 0.15); font-weight: 400; color: #ccc; }
        .table-number { font-size: calc(var(--table-size) * 0.35); font-weight: 700; color: #ffffff; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: auto; line-height: 1; opacity: 0; transition: opacity 0.3s ease; }
        .table-card .table-id, .table-card .table-name { transition: opacity 0.3s ease; }
        .table-card.is-spinning .table-id, .table-card.is-spinning .table-name { opacity: 1; }
        .table-card.is-spinning .table-number { opacity: 0.2; }
        .table-card.locked .table-id, .table-card.locked .table-name { opacity: 1; }
        .table-card.locked .table-number { opacity: 0; }
        .locked-number { font-size: calc(var(--table-size) * 0.4); font-weight: 700; color: var(--locked-color); }

        .group-abc { border-color: var(--group-abc-border); }
        .group-de { border-color: var(--group-de-border); }
        .group-fgi { border-color: var(--group-fgi-border); }
        .group-hj { border-color: var(--group-hj-border); }
        .group-main { border-color: var(--group-main-border); width: calc(var(--table-size) * 1.2); height: calc(var(--table-size) * 1.2); }

        #fireworks-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; pointer-events: none; }
        #winner-announcement { display: none; position: fixed; top: 20px; right: 20px; width: auto; white-space: nowrap; background: rgba(13, 27, 42, 0.9); color: var(--accent-color); padding: 20px 40px; border-radius: 15px; font-size: 2.5em; font-weight: 700; z-index: 1000; animation: fadeInTopRight 1s; border: 3px solid var(--accent-color); box-shadow: 0 0 30px rgba(255, 195, 0, 0.5); transform-origin: top right; }
        @keyframes fadeInTopRight { from { opacity: 0; transform: scale(0.9) translateY(-20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        #settings-container { position: fixed; bottom: 20px; right: 20px; z-index: 1002; }
        #settings-toggle-btn { width: 60px; height: 60px; border-radius: 50%; background-color: var(--accent-color); color: var(--bg-color); border: none; cursor: pointer; font-size: 1.8em; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.3s ease; }
        #settings-toggle-btn:hover { transform: rotate(45deg); }
        #settings-panel { position: absolute; bottom: 80px; right: 0; width: 300px; background-color: var(--primary-card-bg); border: 1px solid var(--secondary-card-bg); border-radius: 10px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); transform: translateY(20px) scale(0.95); opacity: 0; visibility: hidden; transition: all 0.3s ease-in-out; transform-origin: bottom right; }
        #settings-container.expanded #settings-panel { transform: translateY(0) scale(1); opacity: 1; visibility: visible; }
        .settings-group { margin-bottom: 18px; text-align: left; }
        .settings-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9em; }
        .settings-group input[type="number"] { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid var(--secondary-card-bg); background-color: var(--bg-color); color: var(--text-color); box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input { flex-grow: 1; }
        .settings-group button, #reset-button { width: 100%; padding: 10px 15px; font-size: 1em; font-weight: 600; color: white; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .settings-group button { background-color: var(--secondary-card-bg); }
        .settings-group button:hover { background-color: #5A7D9A; }
        #reset-button { background-color: var(--reset-color); }
        #reset-button:hover { background-color: var(--reset-hover); }
        .settings-group.toggle-group { display: flex; justify-content: space-between; align-items: center; }

        #qrcode-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1001;
        }
        #qrcode-container canvas {
            display: block;
        }
    </style>
</head>
<body>
	<h1><i>返校幸運數字 Let's Go</i></h1>
    <div id="tables-container"></div>
    <div id="winner-announcement"></div>
    <div id="fireworks-container"></div>
    <div id="qrcode-container"></div>

    <div id="settings-container">
        <div id="settings-panel">
            <div class="settings-group toggle-group">
                <label for="test-mode-toggle">測試模式</label>
                <input type="checkbox" id="test-mode-toggle">
            </div>
            <div class="settings-group">
                <label>設定數字範圍</label>
                <div class="input-row">
                    <input type="number" id="min-range-input" placeholder="Min">
                    <input type="number" id="max-range-input" placeholder="Max">
                    <button id="set-range-btn">設定</button>
                </div>
            </div>
            <div class="settings-group">
                <button id="force-end-button" style="background-color: #f39c12;">提早結束遊戲</button>
           </div>
            <div class="settings-group">
                 <button id="reset-button">重新開始遊戲</button>
            </div>
        </div>
        <button id="settings-toggle-btn"><i class="fas fa-cog"></i></button>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.7/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const ip = "{{ ip_address }}";
            if (ip && ip !== '127.0.0.1') {
                const mobileUrl = `http://${ip}:5000/mobile`;
                const qrContainer = document.getElementById('qrcode-container');
                
                const title = document.createElement('div');
                title.textContent = '手機請掃我';
                title.style.textAlign = 'center';
                title.style.fontWeight = 'bold';
                title.style.marginBottom = '5px';
                title.style.color = '#0D1B2A';
                qrContainer.appendChild(title);

                const canvas = document.createElement('canvas');
                qrContainer.appendChild(canvas);

                QRCode.toCanvas(canvas, mobileUrl, { width: 150, margin: 2 }, function (err) {
                    if (err) console.error(err);
                    console.log('QR code generated for:', mobileUrl);
                });
            }
        });

        const socket = io();
        const tablesContainer = document.getElementById('tables-container');
        const winnerAnnounce = document.getElementById('winner-announcement');
        const fireworksContainer = document.getElementById('fireworks-container');
        const fireworks = new Fireworks.default(fireworksContainer);

        const settingsContainer = document.getElementById('settings-container');
        const settingsToggleBtn = document.getElementById('settings-toggle-btn');
        const resetButton = document.getElementById('reset-button');
        const minRangeInput = document.getElementById('min-range-input');
        const maxRangeInput = document.getElementById('max-range-input');
        const setRangeBtn = document.getElementById('set-range-btn');
        const testModeToggle = document.getElementById('test-mode-toggle');
        const forceEndButton = document.getElementById('force-end-button');

        let numberSpinners = {};
        let isGameOver = false;
        let currentNumberRange = [1, 100];
        let currentLayout = [];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createLayout(layout) {
            tablesContainer.innerHTML = '';
            const rows = {};
            layout.forEach(def => {
                if (def.id === '主桌') return;
                const rowNum = def.id.charAt(1);
                if (!rows[rowNum]) rows[rowNum] = [];
                rows[rowNum].push(def);
            });

            Object.keys(rows).sort((a, b) => b.localeCompare(a)).forEach(rowNum => {
                const rowDiv = document.createElement('div');
                rowDiv.classList.add('table-row');
                rows[rowNum].forEach(def => {
                    const card = createTableCard(def);
                    rowDiv.appendChild(card);
                });
                tablesContainer.appendChild(rowDiv);
            });

            const mainTableDef = layout.find(def => def.id === '主桌');
            if (mainTableDef) {
                const mainTableRow = document.createElement('div');
                mainTableRow.classList.add('table-row');
                const mainCard = createTableCard(mainTableDef);
                mainTableRow.appendChild(mainCard);
                tablesContainer.appendChild(mainTableRow);
            }
        }

        function createTableCard(definition) {
            const card = document.createElement('div');
            card.classList.add('table-card', `group-${definition.group}`);
            card.id = `table-${definition.id}`;

            const tableIdDiv = document.createElement('div');
            tableIdDiv.classList.add('table-id');
            tableIdDiv.textContent = definition.id;

            const tableNameDiv = document.createElement('div');
            tableNameDiv.classList.add('table-name');
            tableNameDiv.textContent = definition.name;

            const tableNumberDiv = document.createElement('div');
            tableNumberDiv.classList.add('table-number');
            tableNumberDiv.id = `number-${definition.id}`;

            const lockedNumberDiv = document.createElement('div');
            lockedNumberDiv.classList.add('locked-number');
            lockedNumberDiv.id = `locked-number-${definition.id}`;

            if (definition.id === '主桌') {
                tableIdDiv.textContent = '主桌';
                tableNameDiv.textContent = '';
            }

            card.appendChild(tableIdDiv);
            card.appendChild(tableNameDiv);
            card.appendChild(tableNumberDiv);
            card.appendChild(lockedNumberDiv);
            return card;
        }

        function updateTableStates(state) {
            currentNumberRange = state.number_range;
            minRangeInput.placeholder = `Min: ${currentNumberRange[0]}`;
            maxRangeInput.placeholder = `Max: ${currentNumberRange[1]}`;
            testModeToggle.checked = state.is_test_mode;

            for (const tableId in state.tables) {
                const table = state.tables[tableId];
                const card = document.getElementById(`table-${tableId}`);
                if (!card) continue;

                const tableNumberDiv = document.getElementById(`number-${tableId}`);
                const lockedNumberDiv = document.getElementById(`locked-number-${tableId}`);

                if (table.locked) {
                    card.classList.remove('is-spinning');
                    card.classList.add('locked');
                    lockedNumberDiv.textContent = table.number;
                    if (numberSpinners[tableId]) {
                        clearInterval(numberSpinners[tableId]);
                        delete numberSpinners[tableId];
                    }
                    card.onclick = () => {
                        if (confirm(`您確定要重置「${tableId}」嗎？`)) {
                            socket.emit('reset_table', { table_id: tableId });
                        }
                    };
                } else {
                    card.classList.remove('locked');
                    lockedNumberDiv.textContent = '';
                    card.onclick = null;
                    if (!numberSpinners[tableId]) {
                        card.classList.add('is-spinning');
                        tableNumberDiv.textContent = getRandomInt(currentNumberRange[0], currentNumberRange[1]);
                        numberSpinners[tableId] = setInterval(() => {
                            if (tableNumberDiv) {
                                tableNumberDiv.textContent = getRandomInt(currentNumberRange[0], currentNumberRange[1]);
                            }
                        }, 100);
                    }
                }
            }
        }

        function resetFrontend() {
            Object.values(numberSpinners).forEach(clearInterval);
            numberSpinners = {};
            fireworks.stop();
            winnerAnnounce.style.display = 'none';
            winnerAnnounce.innerHTML = '';
            document.querySelectorAll('.winner').forEach(el => el.classList.remove('winner'));
            isGameOver = false;
        }

        socket.on('update_state', (state) => {
            console.log('State updated:', state);
            // If layout is different, recreate it
            if (JSON.stringify(currentLayout) !== JSON.stringify(state.layout)) {
                currentLayout = state.layout;
                createLayout(currentLayout);
            }
            if (!isGameOver) {
                updateTableStates(state);
            }
        });

        socket.on('game_over', (data) => {
            console.log('Game Over!', data);
            isGameOver = true;
            const winnerId = data.winner.table_id;
            const winnerName = data.winner.name;
            const winnerNumber = data.winner.number;

            Object.values(numberSpinners).forEach(clearInterval);
            numberSpinners = {};

            winnerAnnounce.innerHTML = `恭喜 ${winnerId} ${winnerName} 桌!<br>🎉 ${winnerNumber} 🎉`;
            winnerAnnounce.style.display = 'block';

            const winnerCard = document.getElementById(`table-${winnerId}`);
            if (winnerCard) {
                winnerCard.classList.add('winner');
            }
            fireworks.start();
        });

        socket.on('game_restarted', () => {
            console.log('Game has been restarted by admin.');
            resetFrontend();
            // The next 'update_state' will handle the re-render
        });

        settingsToggleBtn.addEventListener('click', () => {
            settingsContainer.classList.toggle('expanded');
        });

        resetButton.addEventListener('click', () => {
            if (confirm('您確定要重新開始整個遊戲嗎？所有桌次的號碼都將被清空。')) {
                socket.emit('reset_game');
            }
        });

        forceEndButton.addEventListener('click', () => {
            if (confirm('您確定要提早結束遊戲嗎？將以目前已鎖定的最高分決定贏家。')) {
                socket.emit('force_end_game');
            }
        });

        setRangeBtn.addEventListener('click', () => {
            const newMin = parseInt(minRangeInput.value, 10);
            const newMax = parseInt(maxRangeInput.value, 10);
            if (!isNaN(newMin) && !isNaN(newMax) && newMin < newMax) {
                 if (confirm(`確定要將數字範圍設定為 ${newMin} - ${newMax} 嗎？這會重置整個遊戲。`)) {
                    socket.emit('set_number_range', { range: [newMin, newMax] });
                    minRangeInput.value = '';
                    maxRangeInput.value = '';
                }
            } else {
                alert('請輸入有效的數字範圍，且最小值需小於最大值。');
            }
        });

        testModeToggle.addEventListener('change', (e) => {
            const isEnabled = e.target.checked;
            if (confirm(`您確定要${isEnabled ? '開啟' : '關閉'}測試模式嗎？這會重置整個遊戲。`)) {
                socket.emit('set_test_mode', { enabled: isEnabled });
            } else {
                e.target.checked = !isEnabled; // Revert the checkbox if user cancels
            }
        });

    </script>
</body>
</html>
